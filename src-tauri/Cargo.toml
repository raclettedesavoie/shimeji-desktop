[package]
name = "shimeji-desktop"
version = "0.3.0"
edition = "2021"
publish = false

# Un SEUL binaire, délibérément. Le mode simulation (Tâche 9) est une
# sous-commande (`--sim`) et non une seconde cible : deux cibles binaires
# d'un même paquet ne partagent du code que par une cible `lib`, et ajouter
# un `lib.rs` pour cela seul réorganiserait tout le projet.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` : le module `tauri::tray` existe sans elle, mais sa dépendance
# n'est pas tirée — c'est une feature de Tauri (Cargo.toml:129). Sans elle,
# `TrayIconBuilder` reste introuvable alors que le `use` compile.
tauri = { version = "2", features = ["tray-icon"] }

# `derive` engendre le code de (dé)sérialisation à la compilation, à partir
# des annotations sur les structs — c'est ce qui évite d'écrire le parsing
# de mascot.json à la main (Tâche 4).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Décodage PNG, pour la SEULE image dont on mesure la boîte opaque (la
# hitbox de chaque pack installé). Les 45 autres frames ne sont jamais
# décodées : leur taille se lit dans les 24 premiers octets du fichier.
#
# Pas `image` : on ne veut que le PNG, et l'exe release fait 2,7 Mo — un
# objectif tenu de la spec §4. `image` tirerait JPEG, GIF, TIFF et le reste.
png = "0.17"
# Le toast de fin d'assistant (spec §4). UNE seule notification dans tout le
# programme — mais l'écrire à la main demanderait du WinRT, là où la crate
# `windows` que nous avons n'expose que du Win32. Elle tire d'ailleurs
# `tauri-winrt-notification`, ce qui le confirme.
#
# Les dépendances `zbus` qu'elle amène sont le chemin LINUX du plugin : elles
# sont écartées par `cfg` et ne compilent pas ici.
tauri-plugin-notification = "2"
# La mise à jour automatique. Elle vérifie une signature **minisign** avant
# d'installer quoi que ce soit : sans cette vérification, n'importe qui
# capable de répondre à la place de GitHub pourrait faire installer son
# propre exécutable. La clé PUBLIQUE est dans `tauri.conf.json` (elle est
# faite pour ça) ; la privée vit dans les secrets GitHub, jamais ici.
#
# ⚠️ À ne pas confondre avec la signature de code Authenticode : celle-ci
# protège la MISE À JOUR, pas le premier téléchargement. SmartScreen
# avertira toujours.
tauri-plugin-updater = "2"

# Épinglé en 0.61 : c'est la version dont dépend Tauri 2.11.5, et deux versions
# majeures de cette crate donnent deux types `HWND` DISTINCTS. Prendre 0.62
# ferait que le HWND rendu par `window.hwnd()` ne serait pas celui qu'attend
# notre `SetWindowLongPtrW` (contrainte globale, résultat de l'étape 0).
#
# Les `features` sont à activer une par une : la crate `windows` couvre toute
# l'API Windows et ne compile que ce qu'on demande.
[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",                 # HWND, RECT, POINT, BOOL
    "Win32_Graphics_Gdi",               # EnumDisplayMonitors, MONITORINFO, HMONITOR
    "Win32_UI_WindowsAndMessaging",     # Get/SetWindowLongPtrW, GWL_EXSTYLE, GetCursorPos
    "Win32_UI_Input_KeyboardAndMouse",  # GetAsyncKeyState, VK_LBUTTON
    "Win32_UI_HiDpi",                   # GetDpiForMonitor, MDT_EFFECTIVE_DPI
    "Win32_System_Registry",            # Reg{Open,Set,Query,Delete}Value* — démarrage auto
    "Win32_System_Threading",           # OpenProcess, QueryFullProcessImageNameW, AttachThreadInput
    "Win32_System_SystemInformation",   # GetLocalTime, GetTickCount
    "Win32_System_Power",               # GetSystemPowerStatus
    "Win32_System_RemoteDesktop",       # WTSQuerySessionInformationW — verrouillage
    "Win32_Networking_WinHttp",         # WinHttpOpen… — le téléchargement du catalogue
]

# En release, on veut un exe autonome et petit.
[profile.release]
opt-level = "z"     # optimiser la taille : l'exe est distribué, pas un calculateur
lto = true          # optimisation inter-modules
codegen-units = 1   # laisse plus de latitude à LTO, au prix du temps de compilation
strip = true        # retire les symboles de debug
panic = "abort"     # pas de déroulement de pile : plus petit, et on n'attrape aucun panic

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Catalogue de personnages</title>
<style>
  /* Jetons MESURÉS dans le DOM de shimejis.xyz, pas approchés (spec §9). */
  :root {
    --fond: rgb(36, 36, 36);
    --texte: rgb(201, 201, 201);
  }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
  }

  header {
    position: sticky;   /* la recherche reste atteignable sur 2000 cartes */
    top: 0;
    background: var(--fond);
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  nav button {
    background: transparent;
    color: var(--texte);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  nav button[aria-selected="true"] { background: rgba(255, 255, 255, 0.12); }

  #recherche {
    flex: 1;
    background: rgba(255, 255, 255, 0.06);
    color: var(--texte);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 10px;
    font: inherit;
  }

  h2 { font-size: 15px; font-weight: 600; margin: 20px 16px 4px; }

  /* Flex wrap, PAS une CSS grid : c'est ce que fait shimejis.xyz, et les
     cartes ont une largeur fixe. */
  .grille { display: flex; flex-wrap: wrap; padding: 0 8px; }

  .carte {
    width: 223px;
    height: 144px;
    padding: 8px;
    background: transparent;   /* sans bordure ni ombre : mesuré */
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .carte:hover { background: rgba(255, 255, 255, 0.06); }
  .carte[disabled] { cursor: default; opacity: 0.55; }

  .carte img {
    width: 128px;
    height: 128px;
    object-fit: contain;
    border-radius: 0;
    /* Pixel-art : la mise à l'échelle doit rester nette. */
    image-rendering: pixelated;
  }

  .carte span { font-size: 12px; text-align: center; }
  .pastille { color: #7fd67f; }

  /* ── La carte de bibliothèque ────────────────────────────────────────
     Elle porte cinq choses au lieu de deux : vignette, nom, − n +,
     interrupteur, poubelle. `position: relative` pour que la poubelle se
     pose dans son coin sans sortir de la carte. */
  .carte-biblio {
    position: relative;
    justify-content: space-between;
  }
  .carte-biblio img { height: 96px; }   /* de la place pour la rangée */

  .rangee {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  /* Tous les petits boutons de la carte partagent la même assiette : fond
     transparent, texte hérité, et la palette mesurée du site — on
     n'introduit pas une seconde palette pour quatre boutons. */
  .rangee button,
  .poubelle {
    background: rgba(255, 255, 255, 0.08);
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.18);
    font: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 2px 7px;
    cursor: pointer;
  }
  .rangee button:hover:not([disabled]),
  .poubelle:hover:not([disabled]) { background: rgba(255, 255, 255, 0.18); }
  .rangee button[disabled],
  .poubelle[disabled] { opacity: 0.3; cursor: default; }

  .compteur {
    min-width: 14px;          /* la rangée ne doit pas sauter à 0 → 1 */
    text-align: center;
    font-size: 12px;
    color: #7fd67f;
  }

  /* L'interrupteur : un rail et une pastille, en CSS pur. Pas de
     `<input type=checkbox>` — il faudrait le masquer puis le redessiner,
     pour le même résultat et un piège d'accessibilité de plus. Le rôle
     ARIA est posé côté JS. */
  .interrupteur {
    width: 30px;
    height: 16px;
    padding: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
    position: relative;
    cursor: pointer;
  }
  .interrupteur::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgb(201, 201, 201);
    transition: transform 120ms ease;
  }
  .interrupteur.allume { background: rgba(127, 214, 127, 0.35); }
  .interrupteur.allume::after { transform: translateX(14px); background: #7fd67f; }

  /* La poubelle, dans le coin — le seul bouton destructeur de toute
     l'application. */
  .poubelle {
    position: absolute;
    top: 4px; right: 4px;
    padding: 1px 5px;
    font-size: 12px;
  }
  .poubelle:hover:not([disabled]) { background: rgba(214, 90, 90, 0.35); }

  /* Le bandeau des 10. Il AVERTIT, il n'interdit rien : ni bouton
     désactivé, ni confirmation (design §2). */
  .avertissement {
    margin: 12px 16px 0;
    padding: 8px 12px;
    background: rgba(214, 170, 90, 0.15);
    border-left: 3px solid rgb(214, 170, 90);
    font-size: 13px;
  }

  #etat {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.85);
    font-size: 13px;
  }
  #etat:empty { display: none; }
</style>
</head>
<body>
  <header>
    <nav>
      <button id="onglet-catalogue" aria-selected="true">Catalogue</button>
      <button id="onglet-biblio" aria-selected="false">Ma bibliothèque</button>
    </nav>
    <input id="recherche" type="search" placeholder="Rechercher un personnage…">
  </header>

  <main id="contenu"></main>
  <div id="etat"></div>

  <script src="catalogue.js"></script>
</body>
</html>

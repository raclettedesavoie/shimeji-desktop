<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shimeji</title>
<style>
  /* `background: transparent` sur `html` ET `body` : si l'un des deux garde
     un fond, WebView2 peint un rectangle opaque et la transparence de la
     fenêtre ne se voit pas. C'est la cause de faux négatifs la plus
     courante sur ce test, et le spike de l'étape 0 l'a confirmée. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  #pet {
    /* La fenêtre est déjà à la bonne taille : le sprite la remplit. */
    width: 100%;
    height: 100%;
    /* Le pixel-art doit rester net : sans ça, la mise à l'échelle sur un
       écran HiDPI le rend flou — et cet écran est à 125 %. */
    image-rendering: pixelated;
    /* Aucune sélection, aucun glisser natif de l'image : c'est Rust qui
       gère le déplacement (spec §3.1). `pointer-events: none` évite en
       prime que le webview intercepte quoi que ce soit quand Rust
       réactive les clics dans la hitbox (Tâche 11). */
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
</style>
</head>
<body>
  <img id="pet" alt="">
  <script src="pet.js"></script>
</body>
</html>
